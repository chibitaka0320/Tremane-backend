name: Deploy to Production (EC2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        run: ./mvnw clean package -DskipTests

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Transfer jar to EC2
        run: |
          scp target/tremane-app.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/app/tremane-app.new.jar"

      - name: Switch jar, restart service, health check (with auto-rollback)
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'EOF'
            set -e
            cd /home/ec2-user/app

            BACKUP="tremane-app.jar.bak.$(date +%Y%m%d%H%M%S)"
            cp tremane-app.jar "$BACKUP"
            mv tremane-app.new.jar tremane-app.jar
            sudo systemctl restart tremane.service

            sleep 10
            if curl -sf "http://localhost:8080/bodyparts?updatedAt=2000-01-01T00:00:00" > /dev/null; then
              echo "Health check passed"
            else
              echo "Health check failed, rolling back"
              cp "$BACKUP" tremane-app.jar
              sudo systemctl restart tremane.service
              exit 1
            fi
          EOF
